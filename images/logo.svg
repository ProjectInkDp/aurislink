<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a0d2e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="link" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
  </g>

  <!-- Sound wave bars — centered, symmetric -->
  <g filter="url(#glow)" fill="url(#wave)">
    <!-- bar 1 -->
    <rect x="68" y="178" width="14" height="44" rx="7"/>
    <!-- bar 2 -->
    <rect x="92" y="158" width="14" height="84" rx="7"/>
    <!-- bar 3 -->
    <rect x="116" y="138" width="14" height="124" rx="7"/>
    <!-- bar 4 -->
    <rect x="140" y="152" width="14" height="96" rx="7"/>
    <!-- bar 5 (center-left) -->
    <rect x="164" y="130" width="14" height="140" rx="7"/>
    <!-- bar 6 (center-right) -->
    <rect x="222" y="130" width="14" height="140" rx="7"/>
    <!-- bar 7 -->
    <rect x="246" y="152" width="14" height="96" rx="7"/>
    <!-- bar 8 -->
    <rect x="270" y="138" width="14" height="124" rx="7"/>
    <!-- bar 9 -->
    <rect x="294" y="158" width="14" height="84" rx="7"/>
    <!-- bar 10 -->
    <rect x="318" y="178" width="14" height="44" rx="7"/>
  </g>

  <!-- Link chain icon — center gap between bars 5 and 6 -->
  <g filter="url(#glow)" fill="none" stroke="url(#link)" stroke-width="5" stroke-linecap="round">
    <!-- left ring -->
    <rect x="182" y="188" width="26" height="24" rx="12" fill="url(#link)" stroke="none"/>
    <!-- right ring -->
    <rect x="192" y="188" width="26" height="24" rx="12" fill="url(#link)" stroke="none"/>
    <!-- connector -->
    <rect x="193" y="194" width="14" height="12" fill="url(#bg)" stroke="none"/>
  </g>

  <!-- "AL" subtle monogram below wave -->
  <text
    x="200" y="342"
    font-family="'SF Mono', 'Fira Code', monospace"
    font-size="13"
    font-weight="600"
    letter-spacing="6"
    text-anchor="middle"
    fill="#a855f7"
    opacity="0.7"
  >AURISLINK</text>

  <!-- version dot -->
  <circle cx="200" cy="358" r="2.5" fill="#7c3aed" opacity="0.5"/>
</svg>
