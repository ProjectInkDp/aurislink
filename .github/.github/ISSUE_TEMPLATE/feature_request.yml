name: Feature Request
description: Suggest a new feature or improvement for AurisLink.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make AurisLink better? Describe it below.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the context or limitation that motivates this request.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Be as specific as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Did you consider any other approaches? Why did you prefer this one?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Audio source (SoundCloud, Deezer, JioSaavn...)
        - API / endpoints
        - Filters
        - Monitoring / metrics
        - Performance
        - Docker / deployment
        - Developer experience
        - Other
    validations:
      required: true
