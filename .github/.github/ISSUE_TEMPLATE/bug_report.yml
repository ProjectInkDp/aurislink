name: Bug Report
description: Something is broken or behaving unexpectedly in AurisLink.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report, please check if there is already an open issue for this.

  - type: input
    id: version
    attributes:
      label: AurisLink Version
      placeholder: "e.g. 1.3.6"
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js Version
      placeholder: "e.g. v20.11.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Ubuntu 22.04, Android (Termux), Windows WSL"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you expect and what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start AurisLink with config...
        2. Send request to...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output here.
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Config (sensitive values removed)
      description: Paste your config if relevant. Remove passwords and API keys.
      render: typescript
